<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Угон по-братски 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed WebGL city at golden hour; 2D HUD canvas on top; title card floats over live traffic */
  --ink:#140f1f;
  --taxi:#ffd23f;
  --flamingo:#ff4f8b;
  --sea:#2ec4b6;
  --cream:#fff4e0;
  --siren:#ff3b5c;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--font-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
#gl{z-index:1}
#hud{z-index:2;pointer-events:none}
button{font-family:var(--font-body);cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
button:focus-visible{outline:3px solid var(--taxi);outline-offset:3px}
#joy{position:fixed;left:92px;top:75%;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,244,224,.35);background:rgba(255,244,224,.06);pointer-events:none;opacity:.4;display:none;z-index:4}
#joy.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,244,224,.55);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#touch{display:none}
.b{position:fixed;z-index:5;border-radius:50%;border:2px solid rgba(255,244,224,.55);background:rgba(20,15,31,.5);color:var(--cream);font-weight:900;letter-spacing:.04em;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;text-align:center;line-height:1.1}
.b.on{background:var(--taxi);color:var(--ink);border-color:var(--taxi)}
.b.hot{border-color:var(--taxi);box-shadow:0 0 0 3px rgba(255,210,63,.35),0 0 18px rgba(255,210,63,.6)}
.b.dim{opacity:.4}
#bFire{right:14px;bottom:20px;width:92px;height:92px;font-size:14px;border-color:rgba(255,79,139,.85);background:rgba(120,20,50,.45)}
#bFire.on{background:var(--flamingo);color:var(--cream);border-color:var(--flamingo)}
#bDrift{right:118px;bottom:22px;width:70px;height:70px}
#bEnter{right:24px;bottom:126px;width:68px;height:68px}
#bWeap{right:104px;bottom:108px;width:64px;height:64px;font-size:10px}
#bHorn{right:32px;bottom:206px;width:52px;height:52px;font-size:11px}
#tl{position:fixed;left:12px;top:140px;z-index:6;display:flex;gap:8px}
.s{height:34px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,244,224,.4);background:rgba(20,15,31,.6);color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.04em}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(20,15,31,.2) 0%,rgba(20,15,31,.9) 72%)}
.card{width:min(420px,100%);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.logo{font-family:var(--font-display);font-weight:400;font-size:clamp(64px,22vw,108px);line-height:.86;color:var(--taxi);text-shadow:5px 5px 0 var(--flamingo),10px 10px 0 rgba(0,0,0,.45);transform:skewX(-8deg);margin:0}
.logo .eng{display:inline-block}
.logo .d3{display:inline-block;font-size:.4em;vertical-align:top;margin-left:.14em;padding:.06em .2em;background:var(--flamingo);color:var(--cream);border-radius:.12em;text-shadow:none;transform:rotate(9deg)}
.logo small{display:block;font-family:var(--font-body);font-weight:900;font-size:clamp(20px,7vw,30px);letter-spacing:.3em;color:var(--cream);text-shadow:3px 3px 0 var(--sea);margin-top:12px;transform:rotate(-3deg);transform-origin:left center}
.aaa{font-weight:900;font-size:13px;letter-spacing:.18em;color:var(--sea);margin:0}
.aaa span{display:block;font-weight:500;letter-spacing:.02em;color:rgba(255,244,224,.72);font-size:12px;margin-top:3px}
.spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;line-height:1.4}
.spec dt{color:rgba(255,244,224,.6)}
.spec dd{margin:0;font-weight:700}
#play{font-family:var(--font-display);font-size:24px;padding:14px 42px;border:0;border-radius:14px;background:var(--taxi);color:var(--ink);box-shadow:0 6px 0 #b8901a,0 10px 24px rgba(0,0,0,.45)}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901a}
#play:disabled{opacity:.5}
.hint{font-size:12px;line-height:1.5;color:rgba(255,244,224,.68);margin:0;max-width:40ch}
#nogl{color:var(--siren);font-weight:700}
@media (max-height:540px){.logo{font-size:52px}.spec{display:none}.card{gap:9px}}
@media (prefers-reduced-motion:no-preference){.logo .eng{animation:idle .12s steps(2) infinite}}
@keyframes idle{50%{transform:translate(.7px,-.7px)}}
</style>
</head>
<body>
<canvas id="gl" aria-label="Игровой экран"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="touch">
<button class="b" id="bFire" type="button">ОГОНЬ</button>
<button class="b" id="bDrift" type="button">ДРИФТ</button>
<button class="b" id="bEnter" type="button">СЕСТЬ</button>
<button class="b" id="bWeap" type="button">ПУШКА</button>
<button class="b" id="bHorn" type="button">БИП</button>
</div>
<div id="tl"><button class="s" id="bPause" type="button">ПАУЗА</button><button class="s" id="bMute" type="button">ЗВУК: ВКЛ</button></div>
<div id="menu">
<div class="card">
<h1 class="logo"><span class="eng">УГОН</span><span class="d3">3D</span><small>по-братски</small></h1>
<p class="aaa">ААА-ПРОЕКТ*<span>*Абсолютно Ахуенная Аркада</span></p>
<dl class="spec">
<dt>Вес</dt><dd id="wt">~170 КБ вместо 500 МБ</dd>
<dt>Графон</dt><dd>3D, ультра, по меркам 2001 года</dd>
<dt>Розыск</dt><dd>6 звёзд, как у отеля</dd>
<dt>Цель</dt><dd>набомбить $10 000</dd>
</dl>
<button id="play" type="button">ИГРАТЬ</button>
<p class="hint" id="hint"></p>
<p class="hint" id="nogl" hidden></p>
</div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const glc = $('gl'), hud = $('hud'), hx = hud.getContext('2d');
const menu = $('menu'), playBtn = $('play'), hintEl = $('hint'), wtEl = $('wt'), noglEl = $('nogl');
const joyEl = $('joy'), knob = $('knob'), touchUI = $('touch');
const bFire = $('bFire'), bEnter = $('bEnter'), bDrift = $('bDrift'), bHorn = $('bHorn'), bWeap = $('bWeap'), bPause = $('bPause'), bMute = $('bMute'), tl = $('tl');
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const FD = '"Russo One","Arial Black",system-ui,sans-serif';
const FB = '"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

/* ================= utils ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
const rint = n => (rnd() * n) | 0;
const pick = a => a[(rnd() * a.length) | 0];
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const fmt = n => String(Math.max(0, Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const hex = h => { const n = parseInt(h.slice(1), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
const mulC = (c, f) => [Math.min(1, c[0] * f), Math.min(1, c[1] * f), Math.min(1, c[2] * f)];
function mulberry32(s) {
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ================= world ================= */
const NB = 9, ROAD = 96, BLK = 330, CELL = ROAD + BLK, GRID = NB * CELL + ROAD;
const BEACH = 340, WATER_X = GRID + BEACH, WORLD_H = GRID, SW = 18, LANE = ROAD / 4;
const SUNX = 0.8, SUNY = -0.45, SIDE_H = 0.6, SHADOW_Y = 0.95;
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1], DANG = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
const wr = mulberry32(19112026);
const wrr = (a, b) => a + wr() * (b - a);
const wpick = a => a[(wr() * a.length) | 0];
const ROOFS = ['#f4cfa8', '#eab0b9', '#a8d8e0', '#c9b6e4', '#f6e3b4', '#b8e0d2', '#f2b5a0', '#d7e3fc', '#e9d8c4', '#bfe3c0', '#ffd6e0', '#cfd8dc', '#f7c59f'];
const GLASS = ['#6fa8c9', '#5e8fb8', '#7fb7be', '#88a9d6'];

function finishBuilding(b) {
  b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2;
  const r = hex(b.roof);
  b.roofC = r; b.faceC = b.glass ? r : mulC(r, 0.93); b.parC = mulC(r, 0.78);
  return b;
}
function makeBuilding(x, y, w, h) {
  const glass = wr() < 0.2 && w > 60 && h > 60;
  let z = glass ? wrr(150, 250) : wrr(40, 130);
  if (!glass && w * h > 22000) z *= 1.15;
  const b = { kind: 'b', x, y, w, h, z, glass, roof: glass ? wpick(GLASS) : wpick(ROOFS), det: [] };
  if (!glass && w > 90 && h > 80 && wr() < 0.33) {
    const pw = Math.min(w * 0.5, 64), ph = Math.min(h * 0.38, 36);
    b.det.push({ t: 'pool', x: x + wrr(8, w - pw - 8), y: y + wrr(8, h - ph - 8), w: pw, h: ph });
  } else if (glass && wr() < 0.55) {
    b.det.push({ t: 'heli', x: x + w / 2, y: y + h / 2, r: Math.min(w, h) * 0.27 });
  }
  if (w > 44 && h > 44) {
    const n = 1 + ((wr() * 3) | 0);
    for (let k = 0; k < n; k++) {
      const dw = wrr(9, 16), dh = wrr(7, 12), ax = x + wrr(6, w - dw - 6), ay = y + wrr(6, h - dh - 6);
      let bad = false;
      for (const d of b.det) {
        if (d.t === 'pool' && ax < d.x + d.w + 4 && ax + dw > d.x - 4 && ay < d.y + d.h + 4 && ay + dh > d.y - 4) bad = true;
        if (d.t === 'heli' && Math.hypot(ax + dw / 2 - d.x, ay + dh / 2 - d.y) < d.r + 10) bad = true;
      }
      if (!bad) b.det.push({ t: 'ac', x: ax, y: ay, w: dw, h: dh });
    }
  }
  return finishBuilding(b);
}
function makePalm(x, y, base) { return { kind: 'p', x, y, cx: x, cy: y, z: wrr(60, 92), r: wrr(15, 21), rot: wr() * TAU, base: base === undefined ? SIDE_H : base }; }
function sidewalkPalms(b) {
  for (let side = 0; side < 4; side++) {
    if (wr() < 0.45) continue;
    for (let s = 44; s < BLK - 44; s += wrr(64, 92)) {
      let x, y;
      if (side === 0) { x = b.x + s; y = b.y + 5; }
      else if (side === 1) { x = b.x + BLK - 5; y = b.y + s; }
      else if (side === 2) { x = b.x + s; y = b.y + BLK - 5; }
      else { x = b.x + 5; y = b.y + s; }
      b.palms.push(makePalm(x, y));
    }
  }
}
const blocks = [];
const beach = { solids: [], palms: [], circles: [], umbrellas: [], towels: [] };
for (let i = 0; i < NB; i++) {
  blocks.push([]);
  for (let j = 0; j < NB; j++) {
    const x = i * CELL + ROAD, y = j * CELL + ROAD, r = wr();
    let type = r < 0.13 ? 'park' : r < 0.23 ? 'lot' : r < 0.28 ? 'plaza' : 'city';
    if (i === 4 && j === 4) type = 'lot';
    const b = { i, j, x, y, type, buildings: [], solids: [], palms: [], circles: [] };
    const ix = x + SW, iy = y + SW, iw = BLK - SW * 2;
    if (type === 'city') {
      const g = 12, p = wr();
      let rects;
      if (p < 0.18) rects = [[ix + 6, iy + 6, iw - 12, iw - 12]];
      else if (p < 0.42) { const s = wrr(0.36, 0.64) * iw; rects = [[ix + 6, iy + 6, s - 6 - g / 2, iw - 12], [ix + s + g / 2, iy + 6, iw - s - g / 2 - 6, iw - 12]]; }
      else if (p < 0.66) { const s = wrr(0.36, 0.64) * iw; rects = [[ix + 6, iy + 6, iw - 12, s - 6 - g / 2], [ix + 6, iy + s + g / 2, iw - 12, iw - s - g / 2 - 6]]; }
      else {
        const sx = wrr(0.38, 0.62) * iw, sy = wrr(0.38, 0.62) * iw;
        rects = [[ix + 6, iy + 6, sx - 6 - g / 2, sy - 6 - g / 2], [ix + sx + g / 2, iy + 6, iw - sx - g / 2 - 6, sy - 6 - g / 2],
          [ix + 6, iy + sy + g / 2, sx - 6 - g / 2, iw - sy - g / 2 - 6], [ix + sx + g / 2, iy + sy + g / 2, iw - sx - g / 2 - 6, iw - sy - g / 2 - 6]];
      }
      for (const q of rects) {
        const m = wrr(0, 9), bd = makeBuilding(q[0] + m, q[1] + m, q[2] - m * 2, q[3] - m * 2);
        b.buildings.push(bd); b.solids.push(bd);
      }
      if (wr() < 0.65) sidewalkPalms(b);
    } else if (type === 'park') {
      const qx = wr() < 0.5 ? 0.27 : 0.73, qy = wr() < 0.5 ? 0.27 : 0.73;
      if (wr() < 0.65) {
        b.pond = { x: ix + iw * qx, y: iy + iw * qy, rx: wrr(34, 46), ry: wrr(24, 32) };
        b.circles.push({ x: b.pond.x, y: b.pond.y, r: (b.pond.rx + b.pond.ry) / 2 * 0.9 });
      }
      b.bushes = [];
      for (let k = 0; k < 10; k++) {
        const px = ix + wrr(14, iw - 14), py = iy + wrr(14, iw - 14);
        if (Math.abs(px - (x + BLK / 2)) < 20 || Math.abs(py - (y + BLK / 2)) < 20) continue;
        if (b.pond && Math.hypot(px - b.pond.x, py - b.pond.y) < 62) continue;
        if (k % 2) b.palms.push(makePalm(px, py)); else b.bushes.push({ x: px, y: py, r: wrr(8, 14) });
      }
    } else if (type === 'lot') {
      b.spots = [];
      const n = Math.floor((iw - 16) / 32), sx0 = ix + (iw - n * 32) / 2;
      for (let k = 0; k < n; k++) {
        b.spots.push({ x: sx0 + k * 32 + 16, y: iy + 32, a: Math.PI / 2 });
        b.spots.push({ x: sx0 + k * 32 + 16, y: iy + iw - 32, a: -Math.PI / 2 });
      }
      b.sx0 = sx0; b.nsp = n;
      for (let px = ix + 44; px < ix + iw - 30; px += 62) b.palms.push(makePalm(px, y + BLK / 2));
    } else {
      b.fountain = { x: x + BLK / 2, y: y + BLK / 2 };
      b.circles.push({ x: b.fountain.x, y: b.fountain.y, r: 42 });
      for (const f of [[0.18, 0.18], [0.82, 0.18], [0.18, 0.82], [0.82, 0.82]]) b.palms.push(makePalm(ix + iw * f[0], iy + iw * f[1]));
    }
    blocks[i].push(b);
  }
}
for (let y = 70; y < WORLD_H - 50; y += wrr(95, 150)) beach.palms.push(makePalm(GRID + wrr(44, 64), y, 0.3));
for (let y = 90; y < WORLD_H - 70; y += wrr(70, 120)) {
  if (wr() < 0.3) continue;
  const x = wrr(GRID + 120, WATER_X - 80);
  beach.umbrellas.push({ kind: 'u', x, y, cx: x, cy: y, z: 30, r: wrr(15, 19), c1: hex(wpick(['#ff4f8b', '#ffd23f', '#3a86ff', '#2ec4b6', '#ff8c42'])), rot: wr() * TAU });
  beach.towels.push({ x: x + wrr(-8, 14), y: y + wrr(12, 22), a: wrr(-0.5, 0.5), c: hex(wpick(['#ffffff', '#ff4f8b', '#2ec4b6', '#ffd23f', '#9b5de5'])) });
}
for (const ty of [WORLD_H * 0.28, WORLD_H * 0.7]) beach.solids.push(finishBuilding({ kind: 'b', x: WATER_X - 130, y: ty, w: 28, h: 28, z: 52, glass: false, roof: '#ef476f', det: [], tower: true }));
function forBlocksIn(x0, y0, x1, y1, fn) {
  const i0 = Math.max(0, Math.floor(x0 / CELL)), i1 = Math.min(NB - 1, Math.floor(x1 / CELL));
  const j0 = Math.max(0, Math.floor(y0 / CELL)), j1 = Math.min(NB - 1, Math.floor(y1 / CELL));
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) fn(blocks[i][j]);
}

/* ================= geometry helpers (2D sim) ================= */
let W = 1, H = 1;
const view = { x0: 0, y0: 0, x1: 0, y1: 0 };
function inView(x, y, m) { return x > view.x0 - m && x < view.x1 + m && y > view.y0 - m && y < view.y1 + m; }
function vis(o, m) { return inView(o.x, o.y, m); }
function ringPos(b, inset, t) {
  const rx = b.x + inset, ry = b.y + inset, rw = BLK - 2 * inset, P4 = 4 * rw;
  t = ((t % P4) + P4) % P4;
  if (t < rw) return [rx + t, ry, 0];
  t -= rw; if (t < rw) return [rx + rw, ry + t, Math.PI / 2];
  t -= rw; if (t < rw) return [rx + rw - t, ry + rw, Math.PI];
  t -= rw; return [rx, ry + rw - t, -Math.PI / 2];
}
function ringParam(b, inset, x, y) {
  const rx = b.x + inset, ry = b.y + inset, rw = BLK - 2 * inset;
  const cx = clamp(x, rx, rx + rw), cy = clamp(y, ry, ry + rw);
  const dl = cx - rx, dr = rx + rw - cx, dt = cy - ry, db = ry + rw - cy, m = Math.min(dl, dr, dt, db);
  if (m === dt) return cx - rx;
  if (m === dr) return rw + (cy - ry);
  if (m === db) return 2 * rw + (rx + rw - cx);
  return 3 * rw + (ry + rw - cy);
}
function roadPos(x, y) {
  const kx = Math.floor(x / CELL), ky = Math.floor(y / CELL);
  const onV = kx >= 0 && kx <= NB && x - kx * CELL < ROAD;
  const onH = ky >= 0 && ky <= NB && y - ky * CELL < ROAD;
  if (onV && onH) return { type: 'x', i: kx, j: ky };
  if (onH) return { type: 'h', i: kx, j: ky };
  if (onV) return { type: 'v', i: kx, j: ky };
  return { type: 'o', i: kx, j: ky };
}
function terrainAt(x, y) {
  if (x >= GRID + 26) return 2;
  const kx = Math.floor(x / CELL), ky = Math.floor(y / CELL);
  if (kx < 0 || ky < 0 || kx >= NB || ky >= NB) return 0;
  if (x - kx * CELL < ROAD || y - ky * CELL < ROAD) return 0;
  const b = blocks[kx][ky];
  if (b.type === 'park' && x > b.x + SW && x < b.x + BLK - SW && y > b.y + SW && y < b.y + BLK - SW) return 1;
  return 0;
}
function groundY(x, y) {
  if (x >= GRID) return x < WATER_X ? 0.3 : -0.1;
  if (x < 0 || y < 0 || y > WORLD_H) return -0.5;
  const kx = Math.floor(x / CELL), ky = Math.floor(y / CELL);
  if (kx >= NB || ky >= NB) return 0;
  if (x - kx * CELL < ROAD || y - ky * CELL < ROAD) return 0;
  return SIDE_H;
}
const CR = [0, 0, 0];
function circRect(px, py, r, R) {
  const cx = clamp(px, R.x, R.x + R.w), cy = clamp(py, R.y, R.y + R.h);
  const dx = px - cx, dy = py - cy, d2 = dx * dx + dy * dy;
  if (d2 >= r * r) return false;
  if (d2 > 1e-6) { const d = Math.sqrt(d2); CR[0] = dx / d; CR[1] = dy / d; CR[2] = r - d; return true; }

/* ================= pedestrians ================= */
function stepPed(p, dt) {

    const q = ringPos(p.b, p.inset, p.t);
    p.x = q[0]; p.y = q[1]; p.a = q[2] + (p.dir < 0 ? Math.PI : 0);
    p.anim += p.spd * dt * 0.22;
    return;
  }
  if (p.state === 'down') {
    p.timer -= dt;
    const fr = Math.exp(-3.5 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= fr; p.vy *= fr; p.a += p.spin * dt; p.spin *= fr;
    solveStatic(p, 5, false);
    if (p.timer <= 0) { p.state = 'flee'; p.timer = rr(2, 3); const f = focusObj(); p.tx = f.x; p.ty = f.y; p.vx = 0; p.vy = 0; }
    return;
  }
  let gx, gy, sp;
  if (p.state === 'flee') {
    p.timer -= dt;
    const dx = p.x - p.tx, dy = p.y - p.ty, d = Math.hypot(dx, dy) || 1;
    gx = dx / d; gy = dy / d; sp = 135;

    p.retT += dt;

    const dx = q[0] - p.x, dy = q[1] - p.y, d = Math.hypot(dx, dy);

    gx = dx / d; gy = dy / d; sp = 55;
  }
  const k = 1 - Math.exp(-8 * dt);
  p.vx += (gx * sp - p.vx) * k; p.vy += (gy * sp - p.vy) * k;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.a = Math.atan2(p.vy, p.vx);
  p.anim += Math.hypot(p.vx, p.vy) * dt * 0.22;
  solveStatic(p, 5, false);
}
function updatePeds(dt) {
  const c = player.car;
  for (const p of peds) {
    if (p.state === 'walk' && c && c.speed > 75) {
      const dx = p.x - c.x, dy = p.y - c.y;
      if (dx * dx + dy * dy < 7225) { p.state = 'flee'; p.timer = rr(1.4, 2.4); p.tx = c.x; p.ty = c.y; p.vx = 0; p.vy = 0; if (rnd() < 0.35) say(p, pick(PED_SCARED)); }
    }

}
function scarePeds(x, y, r) { for (const p of peds) if (p.state === 'walk' && Math.abs(p.x - x) < r && Math.abs(p.y - y) < r) { p.state = 'flee'; p.timer = rr(1.6, 2.6); p.tx = x; p.ty = y; p.vx = 0; p.vy = 0; } }

      const dx = x - c.x, dy = y - c.y;

    };

    hx.fillStyle = 'rgba(20,15,31,0.74)'; rrect(hx, W / 2 - mw / 2 - 14, y0 - hgt / 2, mw + 28, hgt, 12); hx.fill();
    hx.fillStyle = '#fff4e0';
    lines.forEach((ln, i) => hx.fillText(ln, W / 2, y0 - (lines.length - 1) * lh / 2 + i * lh));
    hx.globalAlpha = 1;
  }
  if (game.big) {
    const b = game.big, a = clamp(Math.min(b.t / 0.4, (b.max - b.t) / 0.12), 0, 1);
    const pop = reduceMotion ? 1 : 1 + Math.max(0, (b.t - (b.max - 0.18)) / 0.18) * 0.35, fsz = narrow ? 38 : 56;
    hx.save(); hx.globalAlpha = a; hx.translate(W / 2, H * 0.42); hx.scale(pop, pop);
    hx.textAlign = 'center'; hx.textBaseline = 'middle'; hx.font = fsz + 'px ' + FD;
    hx.fillStyle = '#140f1f'; hx.fillText(b.a, 4, 4);
    otext(b.a, 0, 0, b.col, '#140f1f', 7);
    hx.font = '700 ' + (narrow ? 15 : 18) + 'px ' + FB;
    wrapLines(b.b, Math.min(W - 40, 560)).forEach((ln, i) => otext(ln, 0, fsz * 0.75 + i * 22, '#fff4e0', '#140f1f', 5));
    hx.restore();
  }
}

/* ================= UI wiring ================= */
let glScale = Math.min(window.devicePixelRatio || 1, 2), glDirty = true;
function applyGLSize() { glc.width = Math.max(1, Math.round(W * glScale)); glc.height = Math.max(1, Math.round(H * glScale)); }
function placeJoyIdle() { joyEl.style.left = '92px'; joyEl.style.top = Math.max(150, H - 130) + 'px'; }
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  hudDpr = Math.min(window.devicePixelRatio || 1, 2);
  glc.style.width = W + 'px'; glc.style.height = H + 'px';
  hud.width = Math.round(W * hudDpr); hud.height = Math.round(H * hudDpr); hud.style.width = W + 'px'; hud.style.height = H + 'px';
  glDirty = true;
  radarR = Math.round(clamp(Math.min(W, H) * 0.15, 48, 80));
  tl.style.top = (12 + radarR * 2 + 10) + 'px';
  if (!joy.active) placeJoyIdle();
}
let uiState = '';
function updateUI() {
  if (!isTouch || !game.started) return;
  const s = (player.dead > 0 ? 'dead' : player.car ? 'car' : player.near ? (player.near.driver ? 'jack' : 'enter') : 'foot') + (hasGun() ? 'G' : '') + player.cur;
  if (s === uiState) return;
  uiState = s;
  const inCar = !!player.car;
  bEnter.textContent = inCar ? 'ВЫЙТИ' : player.near && player.near.driver ? 'УГНАТЬ' : 'СЕСТЬ';
  bEnter.classList.toggle('hot', !inCar && !!player.near);
  bEnter.classList.toggle('dim', !inCar && !player.near);
  bDrift.style.display = inCar ? 'flex' : 'none';
  bHorn.style.display = inCar ? 'flex' : 'none';
  bWeap.style.display = hasGun() ? 'flex' : 'none';
  bWeap.textContent = WEAP[player.cur].short;
}
glc.addEventListener('pointerdown', e => {
  if (!game.started || game.paused) return;
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    e.preventDefault(); mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY;
    return;
  }
  if (joy.id !== null || e.clientX > W * 0.62) return;
  e.preventDefault();
  joy.id = e.pointerId; joy.active = true; joy.bx = e.clientX; joy.by = e.clientY; joy.x = 0; joy.y = 0; joy.mag = 0;
  try { glc.setPointerCapture(e.pointerId); } catch (err) {}
  joyEl.style.display = 'block'; joyEl.style.left = joy.bx + 'px'; joyEl.style.top = joy.by + 'px';
  joyEl.classList.add('act'); knob.style.transform = 'translate(0px,0px)';
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; }
  if (e.pointerId !== joy.id) return;
  const dx = e.clientX - joy.bx, dy = e.clientY - joy.by, d = Math.hypot(dx, dy), k = Math.min(d, JR);
  joy.x = d > 0 ? dx / d : 0; joy.y = d > 0 ? dy / d : 0; joy.mag = Math.min(1, d / JR);
  knob.style.transform = 'translate(' + (joy.x * k).toFixed(1) + 'px,' + (joy.y * k).toFixed(1) + 'px)';
});
function pointerEnd(e) {
  if (e.pointerType === 'mouse') mouse.down = false;
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.active = false; joy.mag = 0;
  joyEl.classList.remove('act'); knob.style.transform = 'translate(0px,0px)'; placeJoyIdle();
}
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);
glc.addEventListener('contextmenu', e => e.preventDefault());
function bindBtn(el, down, up) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (err) {} el.classList.add('on'); down(); });
  const end = () => { if (!el.classList.contains('on')) return; el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn(bEnter, actionEnter);
bindBtn(bDrift, () => { drift = true; }, () => { drift = false; });
bindBtn(bFire, () => { fireBtn = true; }, () => { fireBtn = false; });
bindBtn(bWeap, () => { if (game.started && !game.paused) nextWeapon(1); });
bindBtn(bHorn, horn);
bindBtn(bPause, () => pauseGame());
bindBtn(bMute, toggleMute);
let last = -1;
function startGame() {
  initAudio(); resumeAudio();
  menu.style.display = 'none';
  if (!game.started) {
    game.started = true;
    newMission();
    toast(isTouch ? 'Ласточка рядом, жми СЕСТЬ. Стволы валяются по городу' : 'Ласточка рядом, жми E. Стволы валяются по городу', 4.5);
  }
  game.paused = false;
  if (isTouch) { touchUI.style.display = 'block'; joyEl.style.display = 'block'; uiState = ''; }
  last = -1;
}
function pauseGame() {
  if (!game.started || game.paused) return;
  game.paused = true;
  for (const k in keys) keys[k] = false;
  drift = false; fireBtn = false; mouse.down = false;
  suspendAudio();
  playBtn.textContent = 'ПРОДОЛЖИТЬ';
  menu.style.display = 'flex';
  try { playBtn.focus({ preventScroll: true }); } catch (e) {}
}
playBtn.addEventListener('click', startGame);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (!game.started || game.paused) { if ((e.code === 'Enter' || e.code === 'Space') && !playBtn.disabled) { e.preventDefault(); startGame(); } return; }
  if (e.code === 'KeyE' || e.code === 'KeyF' || e.code === 'Enter') actionEnter();
  else if (e.code === 'KeyH') horn();
  else if (e.code === 'KeyQ') nextWeapon(1);
  else if (e.code === 'Digit1') selectWeapon('fist');
  else if (e.code === 'Digit2') selectWeapon('pistol');
  else if (e.code === 'Digit3') selectWeapon('smg');
  else if (e.code === 'Digit4') selectWeapon('shotgun');
  else if (e.code === 'Digit5') selectWeapon('rpg');
  else if (e.code === 'KeyP' || e.code === 'Escape') pauseGame();
  else if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; drift = false; fireBtn = false; mouse.down = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);
glc.addEventListener('webglcontextlost', e => { e.preventDefault(); pauseGame(); });
glc.addEventListener('webglcontextrestored', () => { location.reload(); });

/* ================= boot ================= */
function setupEntities() {
  for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {
    const b = blocks[i][j];
    if (b.type !== 'lot') continue;
    b.spots.forEach((s, idx) => {
      const home = i === 4 && j === 4, isStart = home && idx === 1;
      if (home && idx === 3) return;
      if (!isStart && wr() > 0.42) return;
      const c = makeCar(isStart ? 'zhiga' : wpick(['sedan', 'sedan', 'sedan', 'sport', 'van', 'taxi']), s.x, s.y, isStart ? Math.PI / 2 : s.a);
      c.parked = true; c.sleep = true;
      cars.push(c);
      if (isStart) startCar = c;
    });
  }
  START.x = startCar.x + 26; START.y = startCar.y + 4;
  player.x = START.x; player.y = START.y; player.a = Math.PI;
  for (let k = 0; k < 34; k++) cash.push(makeCash());
  for (let k = 0; k < 24; k++) trySpawnTraffic(true);
  for (let k = 0; k < 50 && peds.length < 30; k++) trySpawnPed(true);
}
let perfAcc = 0, perfN = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let raw = last < 0 ? 0.016 : t - last;
  last = t;
  if (!(raw > 0)) raw = 0.016;
  if (raw < 0.1) {
    perfAcc += raw; perfN++;
    if (perfN >= 90) { if (perfAcc / perfN > 0.028 && glScale > 1) { glScale = Math.max(1, glScale - 0.25); glDirty = true; } perfAcc = 0; perfN = 0; }
  }
  const dt = Math.min(raw, 0.05);
  if (!game.paused) {
    const n = Math.ceil(dt / 0.0167), h = dt / n;
    for (let i = 0; i < n; i++) update(h);
    if (game.started) updateAudio();
  }
  updateUI();
  render(t);
}
let booted = false;
function boot(data) {
  if (booted) return;
  booted = true;
  if (data && typeof data.money === 'number' && isFinite(data.money)) { money = dispMoney = Math.max(0, Math.floor(data.money)); game.won = !!data.won; }
  hintEl.textContent = isTouch
    ? 'Левым пальцем тяни джойстик: куда тянешь, туда и едешь. Справа ОГОНЬ, ПУШКА, СЕСТЬ и ДРИФТ. Стволы, аптечки и броники валяются по городу.'
    : 'WASD: ехать и ходить. E: сесть или выйти. Мышь или K: стрелять. Q: сменить пушку. Пробел: дрифт. H: бибикнуть. P: пауза.';
  try { wtEl.textContent = '~' + Math.max(1, Math.round(new Blob([document.documentElement.outerHTML]).size / 1024)) + ' КБ вместо 500 МБ'; } catch (e) {}
  resize();
  buildWorld();
  buildObjects();
  dynMesh = { b: gl.createBuffer(), n: 0 };
  gl.bindBuffer(gl.ARRAY_BUFFER, dynMesh.b);
  gl.bufferData(gl.ARRAY_BUFFER, DBMAX * 4, gl.DYNAMIC_DRAW);
  setupEntities();
  cam.x = player.x; cam.y = player.y - 30;
  computeCamera();
  requestAnimationFrame(frame);
  try { playBtn.focus({ preventScroll: true }); } catch (e) {}
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ money: Math.floor(money), won: game.won }));
} catch (e) {}
(function () {
  let hot = null;
  try { hot = window.claude && window.claude.hot; } catch (e) {}
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
})();
