<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Угон по-братски</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed canvas city at golden hour; HUD hugs the corners; title card floats over live traffic */
  --asphalt:#262935;
  --ink:#140f1f;
  --taxi:#ffd23f;
  --flamingo:#ff4f8b;
  --sea:#2ec4b6;
  --cream:#fff4e0;
  --font-display:"Russo One","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--font-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:var(--font-body);cursor:pointer;-webkit-appearance:none;appearance:none;margin:0}
button:focus-visible{outline:3px solid var(--taxi);outline-offset:3px}
#joy{position:fixed;left:92px;top:75%;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,244,224,.35);background:rgba(255,244,224,.06);pointer-events:none;opacity:.4;display:none;z-index:4}
#joy.act{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,244,224,.55);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#touch{display:none}
.b{position:fixed;z-index:5;border-radius:50%;border:2px solid rgba(255,244,224,.55);background:rgba(20,15,31,.5);color:var(--cream);font-weight:900;letter-spacing:.04em;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.b.on{background:var(--taxi);color:var(--ink);border-color:var(--taxi)}
.b.hot{border-color:var(--taxi);box-shadow:0 0 0 3px rgba(255,210,63,.35),0 0 18px rgba(255,210,63,.6)}
.b.dim{opacity:.4}
#bEnter{right:16px;bottom:22px;width:84px;height:84px;font-size:13px}
#bDrift{right:112px;bottom:22px;width:72px;height:72px}
#bHorn{right:28px;bottom:120px;width:60px;height:60px}
#tl{position:fixed;left:12px;top:140px;z-index:6;display:flex;gap:8px}
.s{height:34px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,244,224,.4);background:rgba(20,15,31,.6);color:var(--cream);font-size:12px;font-weight:700;letter-spacing:.04em}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(20,15,31,.2) 0%,rgba(20,15,31,.9) 72%)}
.card{width:min(420px,100%);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.logo{font-family:var(--font-display);font-weight:400;font-size:clamp(64px,22vw,108px);line-height:.86;color:var(--taxi);text-shadow:5px 5px 0 var(--flamingo),10px 10px 0 rgba(0,0,0,.45);transform:skewX(-8deg);margin:0}
.logo .eng{display:inline-block}
.logo small{display:block;font-family:var(--font-body);font-weight:900;font-size:clamp(20px,7vw,30px);letter-spacing:.3em;color:var(--cream);text-shadow:3px 3px 0 var(--sea);margin-top:12px;transform:rotate(-3deg);transform-origin:left center}
.aaa{font-weight:900;font-size:13px;letter-spacing:.18em;color:var(--sea);margin:0}
.aaa span{display:block;font-weight:500;letter-spacing:.02em;color:rgba(255,244,224,.72);font-size:12px;margin-top:3px}
.spec{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;line-height:1.4}
.spec dt{color:rgba(255,244,224,.6)}
.spec dd{margin:0;font-weight:700}
#play{font-family:var(--font-display);font-size:24px;padding:14px 42px;border:0;border-radius:14px;background:var(--taxi);color:var(--ink);box-shadow:0 6px 0 #b8901a,0 10px 24px rgba(0,0,0,.45)}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901a}
.hint{font-size:12px;line-height:1.5;color:rgba(255,244,224,.68);margin:0;max-width:40ch}
@media (max-height:520px){.logo{font-size:56px}.spec{display:none}.card{gap:10px}}
@media (prefers-reduced-motion:no-preference){.logo .eng{animation:idle .12s steps(2) infinite}}
@keyframes idle{50%{transform:translate(.7px,-.7px)}}
</style>
</head>
<body>
<canvas id="c" aria-label="Игровой экран"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="touch">
<button class="b" id="bEnter" type="button">СЕСТЬ</button>
<button class="b" id="bDrift" type="button">ДРИФТ</button>
<button class="b" id="bHorn" type="button">БИП</button>
</div>
<div id="tl"><button class="s" id="bPause" type="button">ПАУЗА</button><button class="s" id="bMute" type="button">ЗВУК: ВКЛ</button></div>
<div id="menu">
<div class="card">
<h1 class="logo"><span class="eng">УГОН</span><small>по-братски</small></h1>
<p class="aaa">ААА-ПРОЕКТ*<span>*Абсолютно Ахуенная Аркада</span></p>
<dl class="spec">
<dt>Вес</dt><dd id="wt">~100 КБ вместо 500 МБ</dd>
<dt>Графон</dt><dd>ультра, по меркам 1999 года</dd>
<dt>Багов</dt><dd>0, но это не точно</dd>
<dt>Цель</dt><dd>набомбить $5 000</dd>
</dl>
<button id="play" type="button">ИГРАТЬ</button>
<p class="hint" id="hint"></p>
</div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c');
const ctx = cv.getContext('2d', { alpha: false });
const menu = $('menu'), playBtn = $('play'), hintEl = $('hint'), wtEl = $('wt');
const joyEl = $('joy'), knob = $('knob'), touchUI = $('touch');
const bEnter = $('bEnter'), bDrift = $('bDrift'), bHorn = $('bHorn'), bPause = $('bPause'), bMute = $('bMute'), tl = $('tl');
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const FD = '"Russo One","Arial Black",system-ui,sans-serif';
const FB = '"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

/* ================= utils ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = Math.random;
const rr = (a, b) => a + rnd() * (b - a);
const rint = n => (rnd() * n) | 0;
const pick = a => a[(rnd() * a.length) | 0];
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const fmt = n => String(Math.max(0, Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function mulberry32(s) {
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ================= world ================= */
const NB = 9, ROAD = 96, BLK = 330, CELL = ROAD + BLK, GRID = NB * CELL + ROAD;
const BEACH = 340, WATER_X = GRID + BEACH, WORLD_H = GRID, SW = 18, LANE = ROAD / 4;
const SUNX = 0.6, SUNY = 0.36;
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1], DANG = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
const wr = mulberry32(19112026);
const wrr = (a, b) => a + wr() * (b - a);
const wpick = a => a[(wr() * a.length) | 0];
const ROOFS = ['#f4cfa8', '#eab0b9', '#a8d8e0', '#c9b6e4', '#f6e3b4', '#b8e0d2', '#f2b5a0', '#d7e3fc', '#e9d8c4', '#bfe3c0', '#ffd6e0', '#cfd8dc', '#f7c59f'];
const GLASS = ['#6fa8c9', '#5e8fb8', '#7fb7be', '#88a9d6'];

function finishBuilding(b) {
  const g = b.glass;
  b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2;
  b.wW = shade(b.roof, g ? 0.96 : 0.94);
  b.wN = shade(b.roof, g ? 0.84 : 0.8);
  b.wE = shade(b.roof, g ? 0.66 : 0.62);
  b.wS = shade(b.roof, g ? 0.58 : 0.54);
  b.par = shade(b.roof, 0.84);
  b.hi = shade(b.roof, 1.1);
  return b;
}
function makeBuilding(x, y, w, h) {
  const glass = wr() < 0.2 && w > 60 && h > 60;
  let z = glass ? wrr(130, 215) : wrr(38, 120);
  if (!glass && w * h > 22000) z *= 1.15;
  const b = { kind: 'b', x, y, w, h, z, glass, roof: glass ? wpick(GLASS) : wpick(ROOFS), det: [] };
  if (!glass && w > 90 && h > 80 && wr() < 0.33) {
    const pw = Math.min(w * 0.5, 64), ph = Math.min(h * 0.38, 36);
    b.det.push({ t: 'pool', x: x + wrr(8, w - pw - 8), y: y + wrr(8, h - ph - 8), w: pw, h: ph });
  } else if (glass && wr() < 0.55) {
    b.det.push({ t: 'heli', x: x + w / 2, y: y + h / 2, r: Math.min(w, h) * 0.27 });
  }
  if (w > 44 && h > 44) {
    const n = 1 + ((wr() * 3) | 0);
    for (let k = 0; k < n; k++) {
      const dw = wrr(9, 16), dh = wrr(7, 12), ax = x + wrr(6, w - dw - 6), ay = y + wrr(6, h - dh - 6);
      let bad = false;
      for (const d of b.det) {
        if (d.t === 'pool' && ax < d.x + d.w + 4 && ax + dw > d.x - 4 && ay < d.y + d.h + 4 && ay + dh > d.y - 4) bad = true;
        if (d.t === 'heli' && Math.hypot(ax + dw / 2 - d.x, ay + dh / 2 - d.y) < d.r + 10) bad = true;
      }
      if (!bad) b.det.push({ t: 'ac', x: ax, y: ay, w: dw, h: dh });
    }
  }
  return finishBuilding(b);
}
function makePalm(x, y) { return { kind: 'p', x, y, cx: x, cy: y, z: wrr(55, 88), r: wrr(15, 21), rot: wr() * TAU, ph: wr() * TAU }; }
function sidewalkPalms(b) {
  for (let side = 0; side < 4; side++) {
    if (wr() < 0.45) continue;
    for (let s = 44; s < BLK - 44; s += wrr(64, 92)) {
      let x, y;
      if (side === 0) { x = b.x + s; y = b.y + 5; }
      else if (side === 1) { x = b.x + BLK - 5; y = b.y + s; }
      else if (side === 2) { x = b.x + s; y = b.y + BLK - 5; }
      else { x = b.x + 5; y = b.y + s; }
      b.palms.push(makePalm(x, y));
    }
  }
}

const blocks = [];
const beach = { solids: [], palms: [], circles: [], umbrellas: [], towels: [] };
for (let i = 0; i < NB; i++) {
  blocks.push([]);
  for (let j = 0; j < NB; j++) {
    const x = i * CELL + ROAD, y = j * CELL + ROAD, r = wr();
    let type = r < 0.13 ? 'park' : r < 0.23 ? 'lot' : r < 0.28 ? 'plaza' : 'city';
    if (i === 4 && j === 4) type = 'lot';
    const b = { i, j, x, y, type, buildings: [], solids: [], palms: [], circles: [] };
    const ix = x + SW, iy = y + SW, iw = BLK - SW * 2;
    if (type === 'city') {
      const g = 12, p = wr();
      let rects;
      if (p < 0.18) rects = [[ix + 6, iy + 6, iw - 12, iw - 12]];
      else if (p < 0.42) { const s = wrr(0.36, 0.64) * iw; rects = [[ix + 6, iy + 6, s - 6 - g / 2, iw - 12], [ix + s + g / 2, iy + 6, iw - s - g / 2 - 6, iw - 12]]; }
      else if (p < 0.66) { const s = wrr(0.36, 0.64) * iw; rects = [[ix + 6, iy + 6, iw - 12, s - 6 - g / 2], [ix + 6, iy + s + g / 2, iw - 12, iw - s - g / 2 - 6]]; }
      else {
        const sx = wrr(0.38, 0.62) * iw, sy = wrr(0.38, 0.62) * iw;
        rects = [[ix + 6, iy + 6, sx - 6 - g / 2, sy - 6 - g / 2], [ix + sx + g / 2, iy + 6, iw - sx - g / 2 - 6, sy - 6 - g / 2],
          [ix + 6, iy + sy + g / 2, sx - 6 - g / 2, iw - sy - g / 2 - 6], [ix + sx + g / 2, iy + sy + g / 2, iw - sx - g / 2 - 6, iw - sy - g / 2 - 6]];
      }
      for (const q of rects) {
        const m = wrr(0, 9), bd = makeBuilding(q[0] + m, q[1] + m, q[2] - m * 2, q[3] - m * 2);
        b.buildings.push(bd); b.solids.push(bd);
      }
      if (wr() < 0.65) sidewalkPalms(b);
    } else if (type === 'park') {
      const qx = wr() < 0.5 ? 0.27 : 0.73, qy = wr() < 0.5 ? 0.27 : 0.73;
      if (wr() < 0.65) {
        b.pond = { x: ix + iw * qx, y: iy + iw * qy, rx: wrr(34, 46), ry: wrr(24, 32) };
        b.circles.push({ x: b.pond.x, y: b.pond.y, r: (b.pond.rx + b.pond.ry) / 2 * 0.9 });
      }
      b.bushes = [];
      for (let k = 0; k < 10; k++) {
        const px = ix + wrr(14, iw - 14), py = iy + wrr(14, iw - 14);
        if (Math.abs(px - (x + BLK / 2)) < 20 || Math.abs(py - (y + BLK / 2)) < 20) continue;
        if (b.pond && Math.hypot(px - b.pond.x, py - b.pond.y) < 62) continue;
        if (k % 2) b.palms.push(makePalm(px, py)); else b.bushes.push({ x: px, y: py, r: wrr(8, 14) });
      }
    } else if (type === 'lot') {
      b.spots = [];
      const n = Math.floor((iw - 16) / 32), sx0 = ix + (iw - n * 32) / 2;
      for (let k = 0; k < n; k++) {
        b.spots.push({ x: sx0 + k * 32 + 16, y: iy + 32, a: Math.PI / 2 });
        b.spots.push({ x: sx0 + k * 32 + 16, y: iy + iw - 32, a: -Math.PI / 2 });
      }
      b.sx0 = sx0; b.nsp = n;
      for (let px = ix + 44; px < ix + iw - 30; px += 62) b.palms.push(makePalm(px, y + BLK / 2));
    } else {
      b.fountain = { x: x + BLK / 2, y: y + BLK / 2 };
      b.circles.push({ x: b.fountain.x, y: b.fountain.y, r: 42 });
      for (const f of [[0.18, 0.18], [0.82, 0.18], [0.18, 0.82], [0.82, 0.82]]) b.palms.push(makePalm(ix + iw * f[0], iy + iw * f[1]));
    }
    blocks[i].push(b);
  }
}
for (let y = 70; y < WORLD_H - 50; y += wrr(95, 150)) beach.palms.push(makePalm(GRID + wrr(44, 64), y));
for (let y = 90; y < WORLD_H - 70; y += wrr(70, 120)) {
  if (wr() < 0.3) continue;
  const x = wrr(GRID + 120, WATER_X - 80);
  beach.umbrellas.push({ kind: 'u', x, y, cx: x, cy: y, z: 30, r: wrr(15, 19), c1: wpick(['#ff4f8b', '#ffd23f', '#3a86ff', '#2ec4b6', '#ff8c42']), rot: wr() * TAU });
  beach.towels.push({ x: x + wrr(-8, 14), y: y + wrr(12, 22), a: wrr(-0.5, 0.5), c: wpick(['#ffffff', '#ff4f8b', '#2ec4b6', '#ffd23f', '#9b5de5']) });
}
for (const ty of [WORLD_H * 0.28, WORLD_H * 0.7]) beach.solids.push(finishBuilding({ kind: 'b', x: WATER_X - 130, y: ty, w: 28, h: 28, z: 60, glass: false, roof: '#ef476f', det: [] }));

function forBlocksIn(x0, y0, x1, y1, fn) {
  const i0 = Math.max(0, Math.floor(x0 / CELL)), i1 = Math.min(NB - 1, Math.floor(x1 / CELL));
  const j0 = Math.max(0, Math.floor(y0 / CELL)), j1 = Math.min(NB - 1, Math.floor(y1 / CELL));
  for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) fn(blocks[i][j]);
}

/* minimap (pre-rendered, padded so the radar never samples outside it) */
const MM_S = 0.1, MM_PAD = 900;
const mm = document.createElement('canvas');
mm.width = Math.ceil((WATER_X + MM_PAD * 2) * MM_S); mm.height = Math.ceil((WORLD_H + MM_PAD * 2) * MM_S);
(function () {
  const m = mm.getContext('2d');
  m.fillStyle = '#365c33'; m.fillRect(0, 0, mm.width, mm.height);
  m.save(); m.scale(MM_S, MM_S); m.translate(MM_PAD, MM_PAD);
  m.fillStyle = '#1f7fa3'; m.fillRect(WATER_X, -MM_PAD, MM_PAD + 50, WORLD_H + MM_PAD * 2);
  m.fillStyle = '#e6cf98'; m.fillRect(GRID, 0, BEACH, WORLD_H);
  m.fillStyle = '#c9ccd4'; m.fillRect(0, 0, GRID, WORLD_H);
  for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {
    const b = blocks[i][j];
    m.fillStyle = b.type === 'park' ? '#4e8a47' : b.type === 'lot' ? '#626875' : b.type === 'plaza' ? '#a99f8c' : '#4b505e';
    m.fillRect(b.x, b.y, BLK, BLK);
  }
  m.restore();
})();

/* ================= entities ================= */
const TYPES = {
  sedan: { l: 40, w: 19, max: 285, acc: 245, hand: 2.6, mass: 1, names: ['Тазик', 'Седан бати', 'Корыто', 'Семейный седан'], colors: ['#e63946', '#f1faee', '#457b9d', '#2a9d8f', '#e9c46a', '#264653', '#8d99ae', '#ffb4a2', '#6d597a', '#b5838d'] },
  taxi: { l: 40, w: 19, max: 295, acc: 255, hand: 2.6, mass: 1, names: ['Такси без лицензии'], colors: ['#ffd23f'] },
  sport: { l: 42, w: 19, max: 440, acc: 410, hand: 3.0, mass: 0.9, names: ['Спорткар мажора', 'Ракета', 'Пушка-гонка'], colors: ['#ff006e', '#fb5607', '#f8f9fa', '#111318', '#3a86ff', '#8338ec', '#06d6a0'] },
  van: { l: 52, w: 23, max: 215, acc: 175, hand: 2.0, mass: 1.7, names: ['Фургон с диванами', 'Буханка', 'Фургон доставки'], colors: ['#f8f9fa', '#ced4da', '#6c757d', '#8ecae6'] },
  police: { l: 42, w: 20, max: 365, acc: 335, hand: 2.9, mass: 1.25, names: ['Ментовоз'], colors: ['#f8f9fa'] },
  zhiga: { l: 38, w: 19, max: 245, acc: 200, hand: 2.5, mass: 0.95, names: ['Ласточка'], colors: ['#9ec1a3'] },
};
let carId = 0;
function makeCar(type, x, y, a) {
  const T = TYPES[type], color = pick(T.colors);
  return { id: ++carId, type, T, x, y, a, vx: 0, vy: 0, vf: 0, vl: 0, speed: 0, spin: 0, l: T.l, w: T.w, color, roofC: shade(color, 1.1), name: pick(T.names), hp: 100, dead: false, driver: null, ai: null, throttle: 0, steer: 0, hb: false, sleep: false, parked: false, skL: null, skR: null, skidding: false, hitT: 0 };
}
const SHIRTS = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#1a535c', '#f7fff7', '#ff9f1c', '#2ec4b6', '#e71d36', '#9b5de5', '#f15bb5', '#00bbf9', '#00f5d4'];
const PANTS = ['#2b2d42', '#3d405b', '#6c584c', '#264653', '#1d3557', '#5e548e'];
const HAIR = ['#2b1d14', '#4a2c1d', '#7a5230', '#d9b26f', '#1a1a1a', '#9e9e9e', '#b5651d'];
const SKIN = ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#ffdbac'];
const PLAYER_LOOK = { shirt: '#1e1e26', pants: '#1e1e26', hair: '#2b1d14', skin: '#f1c27d', hat: '#111111', stripes: true };
function makePed(b, x, y) {
  return { b, inset: rr(9, 14), t: 0, dir: rnd() < 0.5 ? 1 : -1, spd: rr(22, 38), x, y, a: 0, vx: 0, vy: 0, state: 'walk', timer: 0, tx: 0, ty: 0, anim: rnd() * 6, spin: 0, retT: 0, shirt: pick(SHIRTS), pants: pick(PANTS), hair: pick(HAIR), skin: pick(SKIN), hat: rnd() < 0.15 ? pick(['#ffffff', '#e63946', '#1d3557', '#ffd23f']) : null, stripes: false };
}

let cars = [], peds = [];

function curbPoint() {

  }

}

  let B = curbPoint();

function addWanted(n) {

/* ================= world upkeep ================= */
function manage(dt) {
  game.mgT -= dt;
  if (game.mgT > 0) return;
  game.mgT = 0.25;
  const f = focusObj();
  cars = cars.filter(c => {
    if (c === player.car || c.parked) return true;
    const d = Math.hypot(c.x - f.x, c.y - f.y);
    if (c.driver === 'npc') return d < 1500;
    if (c.driver === 'police') { if (c.ai.mode === 'leave' && d > 900 && !inView(c.x, c.y, 80)) return false; return d < 1800; }
    return d < 2200;
  });
  let traffic = 0, chase = 0;
  for (const c of cars) {
    if (c.driver === 'npc' || (c.driver === 'police' && c.ai.mode === 'patrol')) traffic++;
    else if (c.driver === 'police' && c.ai.mode === 'chase') chase++;
  }
  if (traffic < 20) trySpawnTraffic(false);
  if (wanted > 0 && game.started) {
    game.polT -= 0.25;
    if (chase < [0, 1, 2, 3, 4, 6][wanted] && game.polT <= 0) { spawnPolice(); game.polT = 1.2; }
  }
  peds = peds.filter(p => Math.abs(p.x - f.x) < 1300 && Math.abs(p.y - f.y) < 1300);
  if (peds.length < 30) trySpawnPed(false);
}
function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
  }
  for (let i = texts.length - 1; i >= 0; i--) { texts[i].t -= dt; if (texts[i].t <= 0) texts.splice(i, 1); }
  if (game.toast) { game.toast.t -= dt; if (game.toast.t <= 0) game.toast = null; }
  if (game.big) { game.big.t -= dt; if (game.big.t <= 0) game.big = null; }
}
function baseZoom() { return clamp(Math.min(W, H) / 470, 0.66, 1.35); }
function updateCamera(dt) {
  const f = focusObj();

  if (player.car) { fx += player.car.vx * 0.32; fy += player.car.vy * 0.32; }
  const k = 1 - Math.exp(-4.5 * dt);
  cam.x += (fx - cam.x) * k; cam.y += (fy - cam.y) * k;
  const zt = baseZoom() * (1 - 0.3 * clamp((player.car ? player.car.speed : 0) / 400, 0, 1));

function update(dt) {
  game.time += dt;
  const live = game.started && !game.paused;
  updatePlayer(dt, live ? readInput() : NOIN);
  for (const c of cars) {
    if (c.hitT > 0) c.hitT -= dt;
    if (c.driver === 'npc') aiTraffic(c, dt);
    else if (c.driver === 'police') aiPolice(c, dt);
    if (c.sleep) continue;
    carPhysics(c, dt);
    collideCarStatic(c);
  }
  collideCars();
  for (let i = cars.length - 1; i >= 0; i--) {
    const c = cars[i];
    if (c.x > WATER_X + 4) { drownCar(c, i); continue; }
    if (c.hp < 35 && rnd() < (c.dead ? 0.3 : 0.16) && inView(c.x, c.y, 60)) addPart(c.x + Math.cos(c.a) * c.l * 0.32, c.y + Math.sin(c.a) * c.l * 0.32, rr(6, 20), rr(-18, -4), rr(0.8, 1.5), 4, 16, c.dead ? '#3a3a3a' : '#8a8a8a');
    if (!c.driver && !c.sleep && c.speed < 2 && Math.abs(c.spin) < 0.03) { c.sleep = true; c.vx = 0; c.vy = 0; c.spin = 0; c.speed = 0; }
  }
  if (player.car) { player.x = player.car.x; player.y = player.car.y; }
  updatePeds(dt);
  carHits();
  if (live) {
    updateCash(); updateMission(dt); updateWanted(dt);
    if (!game.won && money >= 5000) { game.won = true; bigMsg('НАКОПИЛ $5 000', 'Теперь купи нормальный комп и не проси ААА за полчаса', 4.5); sfx.win(); }

  updateFx(dt);

function otext(s, x, y, fill, stroke, lw) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); ctx.fillStyle = fill; ctx.fillText(s, x, y); }
function wrapLines(txt, maxW) {
  const words = String(txt).split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);

}
function star(x, y, r, col, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r;
    if (i) ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); else ctx.moveTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = on ? 'rgba(20,15,31,0.85)' : 'rgba(255,244,224,0.35)'; ctx.stroke();
}
function drawRadar(t) {
  const R = radarR, cx = 12 + R, cy = 12 + R, range = 800, s = R / range;
  const f = { x: clamp(focusObj().x, -60, WATER_X + 60), y: clamp(focusObj().y, -60, WORLD_H + 60) };
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = '#140f1f'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.globalAlpha = 0.95;
  ctx.drawImage(mm, (f.x + MM_PAD - range) * MM_S, (f.y + MM_PAD - range) * MM_S, range * 2 * MM_S, range * 2 * MM_S, cx - R, cy - R, R * 2, R * 2);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#7dff8a';
  for (const m of cash) { const x = cx + (m.x - f.x) * s, y = cy + (m.y - f.y) * s; if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < R * R) ctx.fillRect(x - 1.5, y - 1.5, 3, 3); }
  const ph = Math.floor(t * 6) % 2;
  for (const c of cars) {
    if (c.driver !== 'police' || !c.ai || c.ai.mode !== 'chase') continue;
    ctx.fillStyle = ph ? '#ff3b5c' : '#3a7bff';
    ctx.beginPath(); ctx.arc(cx + (c.x - f.x) * s, cy + (c.y - f.y) * s, 3.2, 0, TAU); ctx.fill();
  }
  ctx.restore();
  if (mission && mission.stage !== 'wait') {
    const P = mission.stage === 'pick' ? mission.A : mission.B;
    let x = (P.x - f.x) * s, y = (P.y - f.y) * s;
    const d = Math.hypot(x, y);
    if (d > R - 7) { x *= (R - 7) / d; y *= (R - 7) / d; }
    ctx.fillStyle = mission.stage === 'pick' ? '#ffd23f' : '#2ec4b6'; ctx.strokeStyle = '#140f1f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx + x, cy + y, 5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(player.car ? player.car.a : player.a);
  ctx.fillStyle = '#fff4e0'; ctx.strokeStyle = '#140f1f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-5, -5); ctx.lineTo(-2, 0); ctx.lineTo(-5, 5); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.beginPath(); ctx.arc(cx, cy, R - 2.5, 0, TAU); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,244,224,0.45)'; ctx.stroke();

}
function drawHUD(t) {
  const pad = 12, narrow = W < 420;
  drawRadar(t);
  dispMoney += (money - dispMoney) * 0.18;
  if (Math.abs(money - dispMoney) < 0.5) dispMoney = money;
  const fs = narrow ? 26 : 30;
  ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = fs + 'px ' + FD;
  otext('$' + fmt(dispMoney), W - pad, pad, '#9dff8a', '#08260d', 6);
  const sy = pad + fs + 16;
  for (let i = 0; i < 5; i++) {
    const on = i < wanted, blink = wantedFlash > 0 && Math.floor(t * 10) % 2 === 0;
    star(W - pad - 10 - (4 - i) * 24, sy, 9.5, on ? (blink ? '#ffffff' : '#ffd23f') : 'rgba(255,244,224,0.14)', on);
  }
  if (player.car) {
    const c = player.car, big = narrow ? 24 : 28;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = big + 'px ' + FD;
    otext(String(Math.round(c.speed * 0.45)), W / 2, pad, '#fff4e0', '#140f1f', 5);
    ctx.font = '700 11px ' + FB;
    otext('км/ч', W / 2, pad + big + 3, 'rgba(255,244,224,0.85)', '#140f1f', 3);
    const bw = 64, bx = W / 2 - bw / 2, by = pad + big + 20;
    ctx.fillStyle = 'rgba(20,15,31,0.75)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 7);
    ctx.fillStyle = c.hp > 60 ? '#5ee07a' : c.hp > 30 ? '#ffd23f' : '#ff4f5e'; ctx.fillRect(bx, by, bw * c.hp / 100, 5);
  }
  if (mission && mission.stage !== 'wait') {
    const m = mission, maxW = Math.max(120, W - (radarR * 2 + 40) - pad), lh = narrow ? 17 : 19;
    ctx.textAlign = 'right'; ctx.textBaseline = 'top'; ctx.font = '700 ' + (narrow ? 13 : 15) + 'px ' + FB;
    let y = sy + 18;
    for (const ln of wrapLines(m.stage === 'pick' ? m.k.a : m.k.b, maxW)) { otext(ln, W - pad, y, m.stage === 'pick' ? '#ffd23f' : '#5ff0e0', '#140f1f', 4); y += lh; }
    const P = m.stage === 'pick' ? m.A : m.B, f = focusObj();
    let info = Math.round(Math.hypot(P.x - f.x, P.y - f.y) * 0.11) + ' м';
    if (m.stage === 'drop') { const left = Math.max(0, m.limit - m.t); info = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0') + '  ·  ' + info; }
    ctx.font = '700 ' + (narrow ? 12 : 13) + 'px ' + FB;
    otext(info, W - pad, y + 1, m.stage === 'drop' && m.limit - m.t < 10 ? '#ff6b6b' : 'rgba(255,244,224,0.92)', '#140f1f', 4);
  }
  if (game.bustT > 0.05) {
    const q = clamp(game.bustT / (player.car ? 1.5 : 0.9), 0, 1), y = H * 0.33;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = (narrow ? 20 : 24) + 'px ' + FD;
    otext('ВЯЖУТ...', W / 2, y, '#ff6b8b', '#140f1f', 6);
    ctx.fillStyle = 'rgba(20,15,31,0.75)'; ctx.fillRect(W / 2 - 70, y + 18, 140, 8);
    ctx.fillStyle = '#ff4f8b'; ctx.fillRect(W / 2 - 69, y + 19, 138 * q, 6);
  }
  if (game.toast) {
    const tt = game.toast, a = clamp(Math.min(tt.t / 0.35, (tt.max - tt.t) / 0.15), 0, 1);
    ctx.globalAlpha = a; ctx.font = '700 ' + (narrow ? 14 : 16) + 'px ' + FB; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = wrapLines(tt.txt, Math.min(W - 48, 520)), lh = narrow ? 19 : 22;
    let w = 0;
    for (const ln of lines) w = Math.max(w, ctx.measureText(ln).width);
    const y0 = H * 0.25, hgt = lines.length * lh + 14;
    ctx.fillStyle = 'rgba(20,15,31,0.74)'; rrect(W / 2 - w / 2 - 14, y0 - hgt / 2, w + 28, hgt, 12); ctx.fill();
    ctx.fillStyle = '#fff4e0';
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y0 - (lines.length - 1) * lh / 2 + i * lh));
    ctx.globalAlpha = 1;
  }
  if (game.big) {
    const b = game.big, a = clamp(Math.min(b.t / 0.4, (b.max - b.t) / 0.12), 0, 1);
    const pop = reduceMotion ? 1 : 1 + Math.max(0, (b.t - (b.max - 0.18)) / 0.18) * 0.35;
    const fsz = narrow ? 38 : 56;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * 0.41); ctx.scale(pop, pop);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = fsz + 'px ' + FD;
    ctx.fillStyle = '#ff4f8b'; ctx.fillText(b.a, 4, 4);
    otext(b.a, 0, 0, '#ffd23f', '#140f1f', 7);
    ctx.font = '700 ' + (narrow ? 15 : 18) + 'px ' + FB;
    wrapLines(b.b, Math.min(W - 40, 560)).forEach((ln, i) => otext(ln, 0, fsz * 0.75 + i * 22, '#fff4e0', '#140f1f', 5));
    ctx.restore();
  }
}
function drawGrade() {
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = gTint; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = gSun; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = gVig; ctx.fillRect(0, 0, W, H);
}
function render(t) {
  const z = cam.z, sh = reduceMotion ? 0 : cam.shake;
  CC.x = cam.x + (rnd() - 0.5) * sh / z; CC.y = cam.y + (rnd() - 0.5) * sh / z;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#4c7a42'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - CC.x * z), DPR * (H / 2 - CC.y * z));
  const hw = W / 2 / z, hh = H / 2 / z;
  view.x0 = CC.x - hw; view.x1 = CC.x + hw; view.y0 = CC.y - hh; view.y1 = CC.y + hh;
  const Hc = Math.max(900, 1.9 * Math.max(hw, hh));
  drawGround(t);
  drawSkids();
  drawShadows();
  drawMarkers(t);
  drawCash(t);
  for (const p of peds) if (vis(p, 20)) drawPerson(p.x, p.y, p.a, p.anim, true, p, p.state === 'down');
  if (!player.car) drawPerson(player.x, player.y, player.a, player.anim, Math.hypot(player.vx, player.vy) > 8, PLAYER_LOOK, player.down > 0);
  drawCars(t);
  drawParticles();
  drawTall(Hc, t);
  drawArrow(t);
  drawTexts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawGrade();
  if (game.started) drawHUD(t);
}

/* ================= UI wiring ================= */
let W = 1, H = 1, DPR = 1, radarR = 60;
function placeJoyIdle() { joyEl.style.left = '92px'; joyEl.style.top = Math.max(150, H - 130) + 'px'; }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  gTint = ctx.createLinearGradient(0, 0, 0, H);
  gTint.addColorStop(0, 'rgba(255,150,70,0.42)');
  gTint.addColorStop(0.5, 'rgba(255,110,150,0.16)');
  gTint.addColorStop(1, 'rgba(90,50,190,0.4)');
  const R = Math.hypot(W, H) / 2;
  gVig = ctx.createRadialGradient(W / 2, H / 2, R * 0.5, W / 2, H / 2, R * 1.05);
  gVig.addColorStop(0, 'rgba(20,6,34,0)');
  gVig.addColorStop(1, 'rgba(20,6,34,0.55)');
  gSun = ctx.createRadialGradient(-W * 0.05, -H * 0.08, 0, -W * 0.05, -H * 0.08, Math.max(W, H) * 0.95);
  gSun.addColorStop(0, 'rgba(255,214,140,0.38)');
  gSun.addColorStop(1, 'rgba(255,214,140,0)');
  radarR = Math.round(clamp(Math.min(W, H) * 0.15, 48, 80));
  tl.style.top = (12 + radarR * 2 + 10) + 'px';
  if (!joy.active) placeJoyIdle();
}
let uiState = '';
function updateUI() {
  if (!isTouch || !game.started) return;
  const s = player.car ? 'car' : player.near ? (player.near.driver ? 'jack' : 'enter') : 'foot';
  if (s === uiState) return;
  uiState = s;
  bEnter.textContent = s === 'car' ? 'ВЫЙТИ' : s === 'jack' ? 'УГНАТЬ' : 'СЕСТЬ';
  bEnter.classList.toggle('hot', s === 'jack' || s === 'enter');
  bEnter.classList.toggle('dim', s === 'foot');
  bDrift.style.display = s === 'car' ? 'flex' : 'none';
  bHorn.style.display = s === 'car' ? 'flex' : 'none';
}
cv.addEventListener('pointerdown', e => {
  if (!game.started || game.paused || joy.id !== null) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.clientX > W * 0.62) return;
  e.preventDefault();
  joy.id = e.pointerId; joy.active = true; joy.bx = e.clientX; joy.by = e.clientY; joy.x = 0; joy.y = 0; joy.mag = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  joyEl.style.display = 'block'; joyEl.style.left = joy.bx + 'px'; joyEl.style.top = joy.by + 'px';
  joyEl.classList.add('act'); knob.style.transform = 'translate(0px,0px)';
});
window.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const dx = e.clientX - joy.bx, dy = e.clientY - joy.by, d = Math.hypot(dx, dy), k = Math.min(d, JR);
  joy.x = d > 0 ? dx / d : 0; joy.y = d > 0 ? dy / d : 0; joy.mag = Math.min(1, d / JR);
  knob.style.transform = 'translate(' + (joy.x * k).toFixed(1) + 'px,' + (joy.y * k).toFixed(1) + 'px)';
});
function joyEnd(e) {
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.active = false; joy.mag = 0;
  joyEl.classList.remove('act'); knob.style.transform = 'translate(0px,0px)'; placeJoyIdle();
  if (!isTouch) joyEl.style.display = 'none';
}
window.addEventListener('pointerup', joyEnd);
window.addEventListener('pointercancel', joyEnd);
function bindBtn(el, down, up) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add('on'); down();
  });
  const end = () => { if (!el.classList.contains('on')) return; el.classList.remove('on'); if (up) up(); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindBtn(bEnter, actionEnter);
bindBtn(bDrift, () => { drift = true; }, () => { drift = false; });
bindBtn(bHorn, horn);
bindBtn(bPause, () => pauseGame());
bindBtn(bMute, toggleMute);
let last = -1;
function startGame() {
  initAudio(); resumeAudio();
  menu.style.display = 'none';
  if (!game.started) {
    game.started = true;
    newMission();
    toast(isTouch ? 'Ласточка рядом, подойди и жми СЕСТЬ' : 'Ласточка рядом, подойди и жми E', 4.5);
  }
  game.paused = false;
  if (isTouch) { touchUI.style.display = 'block'; joyEl.style.display = 'block'; }
  last = -1;
}
function pauseGame() {
  if (!game.started || game.paused) return;
  game.paused = true;
  for (const k in keys) keys[k] = false;
  drift = false;
  suspendAudio();
  playBtn.textContent = 'ПРОДОЛЖИТЬ';
  menu.style.display = 'flex';
  try { playBtn.focus({ preventScroll: true }); } catch (e) {}
}
playBtn.addEventListener('click', startGame);
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (!game.started || game.paused) { if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); startGame(); } return; }
  if (e.code === 'KeyE' || e.code === 'KeyF' || e.code === 'Enter') actionEnter();
  else if (e.code === 'KeyH') horn();
  else if (e.code === 'KeyP' || e.code === 'Escape') pauseGame();
  else if (e.code === 'KeyM') toggleMute();

window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; drift = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);

/* ================= boot ================= */
function setupEntities() {
  for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {
    const b = blocks[i][j];
    if (b.type !== 'lot') continue;
    b.spots.forEach((s, idx) => {
      const home = i === 4 && j === 4, isStart = home && idx === 1;
      if (home && idx === 3) return;
      if (!isStart && wr() > 0.42) return;
      const c = makeCar(isStart ? 'zhiga' : wpick(['sedan', 'sedan', 'sedan', 'sport', 'van', 'taxi']), s.x, s.y, isStart ? Math.PI / 2 : s.a);
      c.parked = true; c.sleep = true;
      cars.push(c);
      if (isStart) startCar = c;
    });
  }
  START.x = startCar.x + 26; START.y = startCar.y + 4;
  player.x = START.x; player.y = START.y; player.a = Math.PI;
  for (let k = 0; k < 34; k++) cash.push(makeCash());
  for (let k = 0; k < 24; k++) trySpawnTraffic(true);
  for (let k = 0; k < 50 && peds.length < 30; k++) trySpawnPed(true);
}
function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = last < 0 ? 0.016 : t - last;
  last = t;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.05) dt = 0.05;
  if (!game.paused) {
    const n = Math.ceil(dt / 0.0167), h = dt / n;
    for (let i = 0; i < n; i++) update(h);
    if (game.started) updateAudio();
  }
  updateUI();
  render(t);
}
let booted = false;
function boot(data) {
  if (booted) return;
  booted = true;
  if (data && typeof data.money === 'number' && isFinite(data.money)) { money = dispMoney = Math.max(0, Math.floor(data.money)); game.won = !!data.won; }
  hintEl.textContent = isTouch
    ? 'Левым пальцем тяни джойстик: куда тянешь, туда и едешь. Справа кнопки СЕСТЬ, ДРИФТ и БИП. Вози заказы, собирай бабки, не попадайся ментам.'
    : 'WASD или стрелки: ехать и ходить. E: сесть или выйти. Пробел: дрифт. H: бибикнуть. P: пауза. Вози заказы, собирай бабки, не попадайся ментам.';
  try { wtEl.textContent = '~' + Math.max(1, Math.round(new Blob([document.documentElement.outerHTML]).size / 1024)) + ' КБ вместо 500 МБ'; } catch (e) {}
  resize();
  setupEntities();
  cam.x = player.x; cam.y = player.y - 40; cam.z = baseZoom();
  requestAnimationFrame(frame);
  try { playBtn.focus({ preventScroll: true }); } catch (e) {}
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ money: Math.floor(money), won: game.won }));
} catch (e) {}
(function () {
  let hot = null;
  try { hot = window.claude && window.claude.hot; } catch (e) {}
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
})();
